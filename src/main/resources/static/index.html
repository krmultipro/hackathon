<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>EducArena</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="auth-screen">
      <div class="auth-card">
        <h1 class="auth-title">EducArena</h1>
        <p class="auth-subtitle">Connectez-vous avant d’entrer dans l’arène.</p>
        <div class="auth-form">
          <input
            id="username"
            class="auth-input"
            type="text"
            placeholder="Nom d'utilisateur"
            autocomplete="username"
          />
          <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
          />
          <div class="auth-actions">
            <button id="login-button" class="auth-button primary" type="button">
              Connexion
            </button>
            <button
              id="register-button"
              class="auth-button secondary"
              type="button"
            >
              Inscription
            </button>
          </div>
          <div id="auth-message" class="auth-message"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
